name: CaptureInbox
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  CaptureInbox:
    type: application
    platform: iOS
    sources:
      - CaptureInbox
    dependencies:
      - target: ShareExtension
        embed: true
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.captureinbox.app
    info:
      path: Support/CaptureInbox-Info.plist
      properties:
        CFBundleDisplayName: Capture Inbox
        UILaunchScreen: {}
        LSApplicationQueriesSchemes:
          - nmap
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.captureinbox.app.share
    info:
      path: Support/ShareExtension-Info.plist
      properties:
        CFBundleDisplayName: Capture Inbox
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
