</style></head><body><main><header><div><small>DARK CONCEPT / 02</small><h1>흩어진 순간이, 다시 연결되도록.</h1><p>스크린샷을 모으고, 살펴보고, 원래 페이지로 이어가는 두 화면.</p></div><a href="dark.html">움직이는 시안 열기 ↗</a></header><section class="screens"><figure><iframe src="dark.html?view=scattered&embed" title="처음 진입한 흩어짐 화면"></iframe><figcaption><span>01</span><strong>흩어진 순간</strong><p>위치와 크기가 다른 장면들이 자유롭게 흩어져 있어요.</p></figcaption></figure><figure><iframe src="dark.html?view=feed&embed" title="정돈된 피드 화면"></iframe><figcaption><span>02</span><strong>한곳에 모아보기</strong><p>중앙에 모인 장면들이 하나씩 제자리를 찾아 펼쳐져요.</p></figcaption></figure><figure><iframe src="dark.html?view=detail&embed" title="스크린샷 상세 화면"></iframe><figcaption><span>03</span><strong>다시 이어보기</strong><p>선택한 장면을 펼쳐보고 연결된 페이지로 이동해요.</p></figcaption></figure></section><p class="note">샘플 콘텐츠를 사용한 UI 시안입니다. 링크는 사진 출처로 연결됩니다.</p></main></body></html>
